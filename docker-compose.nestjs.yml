services:
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      # Public URL of the backend (api subdomain), consumed by Vite at build/runtime
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - web

  backend:
    build:
      context: ./backend_nestjs
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend_nestjs/src:/app/src
      - ./backend_nestjs/package.json:/app/package.json
      - ./backend_nestjs/tsconfig.json:/app/tsconfig.json
      - ./backend_nestjs/prisma:/app/prisma
      - /app/node_modules
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - USER_DATABASE_URL=${USER_DATABASE_URL}
      # Comma-separated list of allowed origins (app subdomain) for CORS + socket.io
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"
    depends_on:
      - redis
    networks:
      - web

  proddb:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: web_fitness_app_user
      POSTGRES_PASSWORD: proddbpassword
      POSTGRES_DB: fitness_prod
    ports:
      - '5432:5432'
    networks:
      - web

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - web

  # Cloudflare Tunnel — exposes frontend/backend via subdomains without opening ports.
  # Configure the tunnel's public hostnames in the Cloudflare Zero Trust dashboard:
  #   app.example.com  -> http://frontend:5173
  #   api.example.com  -> http://backend:3000
  # Then set CLOUDFLARE_TUNNEL_TOKEN in your .env file.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    networks:
      - web

networks:
  web:
    driver: bridge
